
name: Java Maven CI

on:
  push:
    branches:
      - develop
      - main
      - "feature/**"
  pull_request:
    branches:
      - develop
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Temurin Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Give execution permission to Maven Wrapper
        working-directory: backend/gestion-etudiants/gestion-etudiants
        run: chmod +x mvnw

      - name: Build and test with Maven Wrapper
        working-directory: backend/gestion-etudiants/gestion-etudiants
        run: ./mvnw clean verify
